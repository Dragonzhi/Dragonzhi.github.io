<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>配色控制台 · 本地工具</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E1E9F1;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #12171A; }

  .frame-wrap { position: absolute; inset: 0; }
  .frame-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

  .panel {
    position: fixed; top: 16px; right: 16px; width: 320px;
    max-height: calc(100vh - 32px); overflow: auto;
    padding: 14px 16px 16px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .82);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 32px -12px rgba(18, 23, 26, .45), inset 0 1px 0 #fff;
    font-size: 13px;
  }
  .panel.is-collapsed { height: 44px; overflow: hidden; }
  .panel.is-collapsed .body { display: none; }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head b { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .head .tog {
    border: 0; background: #fff; padding: 6px 10px; border-radius: 8px;
    font: inherit; font-size: 12px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(18, 23, 26, .18);
  }

  .presets { display: flex; gap: 6px; margin: 12px 0 4px; }
  .presets button {
    flex: 1; height: 30px; border: 0; border-radius: 8px; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(18, 23, 26, .12), 0 1px 2px rgba(18, 23, 26, .12);
    font: inherit; font-size: 11px; color: #12171A;
  }

  .grp { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid rgba(18, 23, 26, .10); }
  .grp > h3 {
    margin: 0 0 8px; font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: #4C565C;
  }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { font-size: 12.5px; }
  .row .val {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px;
    color: #4C565C; text-align: right; min-width: 62px;
  }
  .row input[type="color"] {
    grid-column: 1 / -1; width: 100%; height: 26px; padding: 0;
    border: 1px solid rgba(18, 23, 26, .16); border-radius: 6px; background: #fff; cursor: pointer;
  }
  .row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: #12171A; height: 20px; }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button {
    flex: 1; padding: 9px 10px; border: 0; border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 12px; background: #fff; color: #12171A;
    box-shadow: 0 1px 2px rgba(18, 23, 26, .18), inset 0 -1px 0 rgba(18, 23, 26, .08);
  }
  .actions button:active { transform: translateY(1px); }

  pre#out {
    margin: 10px 0 0; padding: 10px; max-height: 180px; overflow: auto;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 11px; line-height: 1.6;
    background: rgba(18, 23, 26, .05); border-radius: 8px; white-space: pre-wrap; word-break: break-all;
  }
  .tip { color: #4C565C; font-size: 11.5px; line-height: 1.7; margin: 10px 0 0; }
</style>
</head>
<body>
<div class="frame-wrap"><iframe id="frame" src="../index.html"></iframe></div>

<aside class="panel" id="panel">
  <div class="head">
    <b>配色控制台</b>
    <button class="tog" id="tog" type="button">收起</button>
  </div>

  <div class="body">
    <div class="presets">
      <button type="button" data-p="0" style="background:#E1E9F1" title="Gemini 原样">原样</button>
      <button type="button" data-p="1" style="background:#E7EEF5" title="浅一档">浅一档</button>
      <button type="button" data-p="2" style="background:#F2F5F7" title="旧冷白">旧冷白</button>
      <button type="button" data-p="3" style="background:#D8E3EE" title="更蓝更沉">更沉</button>
    </div>

    <div class="grp">
      <h3>底板与面</h3>
      <div class="row"><label for="c-bg">底板 --bg</label><output class="val" id="v-bg"></output><input type="color" id="c-bg" data-token="--bg"></div>
      <div class="row"><label for="c-surface">面板 --surface</label><output class="val" id="v-surface"></output><input type="color" id="c-surface" data-token="--surface"></div>
      <div class="row"><label for="c-frame">图底 --frame</label><output class="val" id="v-frame"></output><input type="color" id="c-frame" data-token="--frame"></div>
    </div>

    <div class="grp">
      <h3>线</h3>
      <div class="row"><label for="c-line">细线 --line</label><output class="val" id="v-line"></output><input type="color" id="c-line" data-token="--line"></div>
      <div class="row"><label for="c-lineS">强线 --line-strong</label><output class="val" id="v-lineS"></output><input type="color" id="c-lineS" data-token="--line-strong"></div>
    </div>

    <div class="grp">
      <h3>软 UI 卡</h3>
      <div class="row"><label for="c-sd">凸边上 --soft-dark</label><output class="val" id="v-sd"></output><input type="color" id="c-sd" data-token="--soft-dark"></div>
      <div class="row"><label for="c-sl">凸边下 --soft-light</label><output class="val" id="v-sl"></output><input type="color" id="c-sl" data-token="--soft-light"></div>
      <div class="row"><label for="c-ss">内发光 --soft-inset</label><output class="val" id="v-ss"></output><input type="color" id="c-ss" data-token="--soft-inset"></div>
    </div>

    <div class="grp">
      <h3>页面</h3>
      <div class="row"><label for="page">在看的页</label>
        <select id="page" style="grid-column:1/-1;padding:7px;border-radius:8px;border:1px solid rgba(18,23,26,.16)">
          <option value="../index.html">首页</option>
          <option value="../works.html">作品</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="copy">复制导出</button>
      <button type="button" id="reset">重置</button>
    </div>

    <pre id="out"></pre>
    <p class="tip">改完点「复制导出」，把整段贴回来；值存在 localStorage，下次打开还在。</p>
  </div>
</aside>

<script>
(function () {
  'use strict';

  var KEY = 'zloong-palette-console-v1';
  var DEFAULTS = {
    '--bg': '#E1E9F1',
    '--surface': '#EDF3F9',
    '--frame': '#D2DDE7',
    '--line': '#C7D3DF',
    '--line-strong': '#AEBECD',
    '--soft-dark': '#A9BCCD',
    '--soft-light': '#FFFFFF',
    '--soft-inset': '#022143'
  };

  var PRESETS = [
    { name: '原样（Gemini）', bg: '#E1E9F1', surface: '#EDF3F9', frame: '#D2DDE7', line: '#C7D3DF', lineS: '#AEBECD', sd: '#A9BCCD', ss: '#022143' },
    { name: '浅一档', bg: '#E7EEF5', surface: '#F2F6FA', frame: '#D8E2EB', line: '#CDD8E3', lineS: '#B6C4D1', sd: '#B7C6D3', ss: '#16324A' },
    { name: '旧冷白', bg: '#F2F5F7', surface: '#FFFFFF', frame: '#D6DEE3', line: '#CBD6DB', lineS: '#B9C5CC', sd: '#C3CED5', ss: '#284456' },
    { name: '更蓝更沉', bg: '#D8E3EE', surface: '#E6EFF7', frame: '#C8D6E4', line: '#BBCBDC', lineS: '#A6B9CC', sd: '#9FB4C9', ss: '#0C2740' }
  ];

  var frame = document.getElementById('frame');
  var out = document.getElementById('out');
  var panel = document.getElementById('panel');
  var current = {};

  function hexOf(v) {
    return /^#[0-9a-f]{6}$/i.test(v || '') ? v : '#000000';
  }

  function target() {
    var doc = frame.contentDocument;
    return doc && doc.documentElement;
  }

  function apply() {
    var root = target();
    if (!root) { return; }
    Object.keys(DEFAULTS).forEach(function (t) { root.style.setProperty(t, current[t]); });
    syncUi();
    writeOut();
    try { localStorage.setItem(KEY, JSON.stringify({ c: current })); } catch (e) {}
  }

  function syncUi() {
    var ID = {
      '--bg': 'bg', '--surface': 'surface', '--frame': 'frame',
      '--line': 'line', '--line-strong': 'lineS',
      '--soft-dark': 'sd', '--soft-light': 'sl', '--soft-inset': 'ss'
    };
    Object.keys(DEFAULTS).forEach(function (t) {
      var input = document.querySelector('[data-token="' + t + '"]');
      if (input) { input.value = hexOf(current[t]); }
      var v = document.getElementById('v-' + ID[t]);
      if (v) { v.textContent = current[t]; }
    });
  }

  function writeOut() {
    var lines = ['/* [data-theme="cool"]（由 tools/palette-console.html 导出） */'];
    Object.keys(DEFAULTS).forEach(function (t) { lines.push(t + ': ' + current[t] + ';'); });
    out.textContent = lines.join('\n');
  }

  function bind() {
    document.querySelectorAll('[data-token]').forEach(function (input) {
      input.addEventListener('input', function () {
        current[input.getAttribute('data-token')] = input.value;
        apply();
      });
    });

    document.querySelectorAll('[data-p]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = PRESETS[parseInt(btn.getAttribute('data-p'), 10)];
        current['--bg'] = p.bg;
        current['--surface'] = p.surface;
        current['--frame'] = p.frame;
        current['--line'] = p.line;
        current['--line-strong'] = p.lineS;
        current['--soft-dark'] = p.sd;
        current['--soft-inset'] = p.ss;
        current['--soft-light'] = '#FFFFFF';
        apply();
      });
    });

    document.getElementById('copy').addEventListener('click', function () {
      var text = out.textContent;
      var btn = this;
      var flash = function (label) { btn.textContent = label; setTimeout(function () { btn.textContent = '复制导出'; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash('已复制'); }, function () { flash('复制失败'); });
      } else {
        flash('请手动复制');
      }
    });

    document.getElementById('reset').addEventListener('click', function () {
      current = Object.assign({}, DEFAULTS);
      apply();
    });

    document.getElementById('tog').addEventListener('click', function () {
      panel.classList.toggle('is-collapsed');
      this.textContent = panel.classList.contains('is-collapsed') ? '展开' : '收起';
    });

    document.getElementById('page').addEventListener('change', function () {
      frame.src = this.value;
    });

    frame.addEventListener('load', function () {
      try {
        var root = target();
        if (root) { root.style.setProperty('color-scheme', 'light'); }
      } catch (e) {}
      apply();
    });
  }

  /* 读 localStorage */
  current = Object.assign({}, DEFAULTS);
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.c) {
      Object.keys(DEFAULTS).forEach(function (t) {
        if (typeof saved.c[t] === 'string') { current[t] = saved.c[t]; }
      });
    }
  } catch (e) {}

  bind();
  apply();
}());
</script>
</body>
</html>
