<!DOCTYPE html>
<html lang="zh-CN" data-theme="cool">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>铭牌材质调参台</title>
<link rel="stylesheet" href="../css/tokens-screen.css">
<link rel="stylesheet" href="../css/site.css">
<style>
  body { background: var(--bg); }
  .shell { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: var(--s7) var(--s6) var(--s10); }
  h1 { font-size: var(--t2); font-weight: 900; letter-spacing: -.02em; margin: 0 0 var(--s1); }
  .sub { color: var(--fg-dim); font-size: var(--t4); margin: 0 0 var(--s6); line-height: 1.85; max-width: 62em; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s6); align-items: start; }

  /* ================= 预览 ================= */
  .stage {
    position: relative;
    border-radius: 20px;
    padding: var(--s6);
    background: var(--bg);
    box-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, .9),
      inset -1px -1px 0 rgba(18, 23, 26, .08),
      0 2px 0 rgba(18, 23, 26, .08),
      0 10px 24px -12px rgba(18, 23, 26, .22);
  }
  .stage + .stage { margin-top: var(--s5); }
  .cap { font-family: var(--mono); font-size: var(--t5); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-faint); margin: 0 0 var(--s4); }
  .row { display: flex; align-items: center; gap: var(--s3); }
  .row + .row { margin-top: var(--s5); }
  .row .tag { width: 40px; flex: none; font-family: var(--mono); font-size: 11px; color: var(--fg-faint); letter-spacing: .08em; }
  .zoom { overflow: hidden; width: 132px; height: 132px; }
  .zoom .plate { transform: scale(3); transform-origin: top left; }

  /* ================= 铭牌本体（全部参数化） ================= */
  .plate {
    --pw: 44px;
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--pw);
    height: var(--pw);
    border-radius: calc(var(--r) * 1px);
    color: var(--fg);
    background: linear-gradient(calc(var(--ang) * 1deg), var(--plate-hi) 0%, var(--plate-lo) 100%);
    box-shadow:
      inset calc(var(--bv) * 1px) calc(var(--bv) * 1px) 0 rgba(255, 255, 255, var(--hi-a)),
      inset calc(var(--bv) * -1px) calc(var(--bv) * -1px) 0 rgba(18, 23, 26, var(--lo-a)),
      0 calc(var(--edge) * 1px) 0 rgba(18, 23, 26, var(--edge-a)),
      0 calc(var(--soft-y) * 1px) calc(var(--soft-b) * 1px) calc(var(--soft-s) * -1px) rgba(18, 23, 26, var(--soft-a));
    overflow: hidden;
    text-decoration: none;
    transition: transform .12s cubic-bezier(.2, .7, .3, 1),
                box-shadow .12s cubic-bezier(.2, .7, .3, 1),
                color .12s cubic-bezier(.2, .7, .3, 1);
  }

  /* 静止进光：左上角一束斜光，与顶栏亚克力片同一角度 */
  .plate::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(118deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, .12) 26%, transparent 48%);
    opacity: var(--sh-static);
  }
  /* 悬停扫光：一道光带从左到右只扫一次、扫出即走。
     白芯两侧各带一条可调的墨晕——纯白叠冷白读不出，暗晕给白芯一个参照。 */
  .plate::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    pointer-events: none;
    background-image: linear-gradient(calc(var(--sh-ang) * 1deg),
      transparent calc(50% - var(--sh-w) * .5%),
      rgba(18, 23, 26, var(--sh-edge)) calc(50% - var(--sh-w) * .25%),
      rgba(255, 255, 255, var(--sh-a)) 50%,
      rgba(18, 23, 26, var(--sh-edge)) calc(50% + var(--sh-w) * .25%),
      transparent calc(50% + var(--sh-w) * .5%));
    background-size: 220% 100%;
    background-repeat: no-repeat;
    background-position: 100% 0;
    opacity: 0;
  }
  .plate.is-hover::after,
  .plate:hover::after,
  .plate:focus-visible::after {
    animation: plate-sweep calc(var(--sh-dur) * 1s) cubic-bezier(.2, .7, .3, 1) forwards;
  }
  @keyframes plate-sweep {
    0%   { opacity: 0; background-position: 100% 0; }
    14%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; background-position: 0% 0; }
  }

  /* 图标与字：浮雕（凹刻 / 凸起） */
  .plate svg,
  .plate .label {
    position: relative;
    z-index: 1;
    filter:
      drop-shadow(var(--em-fx) var(--em-fy) 0 rgba(255, 255, 255, var(--em-hi)))
      drop-shadow(calc(var(--em-fx) * -1) calc(var(--em-fy) * -1) 0 rgba(18, 23, 26, var(--em-lo)));
  }
  .plate svg { display: block; width: 26px; height: 26px; fill: currentColor; }

  .plate.is-hover { color: var(--live); }
  .plate.is-press {
    transform: translateY(1px);
    box-shadow:
      inset calc(var(--bv) * -1px) calc(var(--bv) * -1px) 0 rgba(255, 255, 255, var(--hi-a)),
      inset calc(var(--bv) * 1px) calc(var(--bv) * 1px) 0 rgba(18, 23, 26, var(--lo-a)),
      0 1px 0 rgba(18, 23, 26, var(--edge-a)),
      0 2px 6px -2px rgba(18, 23, 26, var(--soft-a));
  }

  /* 文字入口形态 */
  .plate.pill {
    --pw: auto;
    width: auto;
    height: auto;
    min-height: 30px;
    padding: 7px 14px;
    font-family: var(--mono);
    font-size: var(--t5);
    letter-spacing: .1em;
  }

  /* ================= 面板 ================= */
  .panel {
    position: sticky;
    top: var(--s5);
    padding: 18px;
    border-radius: 16px;
    background: var(--bg);
    box-shadow:
      inset 1px 1px 0 rgba(255, 255, 255, .9),
      inset -1px -1px 0 rgba(18, 23, 26, .08),
      0 2px 0 rgba(18, 23, 26, .08),
      0 12px 28px -14px rgba(18, 23, 26, .25);
  }
  .grp { margin: 0 0 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-faint); }
  .grp:not(:first-child) { margin-top: 18px; }
  .ctl { margin: 10px 0 0; }
  .ctl label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--fg-dim); margin-bottom: 3px; }
  .ctl output { color: var(--fg); }
  .ctl input[type="range"] { width: 100%; accent-color: var(--fg); }
  .ctl select {
    width: 100%; padding: 6px 8px; border: 0; border-radius: 6px;
    font-family: var(--mono); font-size: 12px; color: var(--fg);
    background: linear-gradient(180deg, var(--key-face-hi), var(--key-face-lo));
    box-shadow: inset 0 1px 0 #fff, 0 1px 0 var(--key-step);
  }
  .btns { display: flex; gap: 8px; margin: 18px 0 0; }
  .btns button {
    flex: 1; padding: 9px 10px; border: 0; border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--fg);
    background: linear-gradient(180deg, var(--key-face-hi), var(--key-face) 30%, var(--key-face-lo));
    box-shadow: inset 0 1.5px 0 #fff, inset 0 -1.5px 0 rgba(18, 23, 26, .1), 0 2px 0 var(--key-step), 0 3px 0 rgba(18, 23, 26, .15);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btns button:active { transform: translateY(2px); box-shadow: inset 0 2px 4px rgba(18, 23, 26, .18); }
  pre#css {
    margin: 14px 0 0; padding: 12px; border-radius: 8px; max-height: 280px; overflow: auto;
    background: rgba(18, 23, 26, .04);
    font-family: var(--mono); font-size: 11px; line-height: 1.65; color: var(--fg-dim);
    white-space: pre-wrap; word-break: break-all;
  }
  .tip { margin: var(--s3) 0 0; font-size: 12px; color: var(--fg-faint); line-height: 1.7; }

  @media (max-width: 900px) {
    .grid2 { grid-template-columns: 1fr; }
    .panel { position: static; }
  }
</style>
</head>

<script>

  var DEFS = {

    edge: 2, edgeA: .10, softY: 5, softB: 8, softS: 3, softA: .18

  var CTLS = [
    { g: 'grp-face', k: 'r', label: '圆角', min: 0, max: 10, step: .5, unit: 'px' },

    { g: 'grp-face', k: 'ang', label: '面渐变角度', min: 0, max: 180, step: 1, unit: '°' },
    { g: 'grp-sheen', k: 'shStatic', label: '静止进光', min: 0, max: 1, step: .01 },
    { g: 'grp-sheen', k: 'shA', label: '扫光白度', min: 0, max: 1, step: .01 },
    { g: 'grp-sheen', k: 'shEdge', label: '光带墨晕', min: 0, max: .2, step: .01 },
    { g: 'grp-sheen', k: 'shW', label: '光带宽度', min: 6, max: 60, step: 1, unit: '%' },
    { g: 'grp-sheen', k: 'shAng', label: '光带角度', min: 45, max: 165, step: 1, unit: '°' },
    { g: 'grp-sheen', k: 'shDur', label: '扫动时长', min: .2, max: 1.2, step: .05, unit: 's' },
    { g: 'grp-emboss', k: 'emX', label: '浮雕位移', min: 0, max: 2, step: .25, unit: 'px' },
    { g: 'grp-emboss', k: 'emHi', label: '浮雕受光', min: 0, max: 1, step: .01 },
    { g: 'grp-emboss', k: 'emLo', label: '浮雕阴影', min: 0, max: .8, step: .01 },
    { g: 'grp-shadow', k: 'edge', label: '硬沿高度', min: 0, max: 5, step: .5, unit: 'px' },
    { g: 'grp-shadow', k: 'edgeA', label: '硬沿墨度', min: 0, max: .3, step: .01 },
    { g: 'grp-shadow', k: 'softY', label: '柔影下移', min: 0, max: 12, step: .5, unit: 'px' },
    { g: 'grp-shadow', k: 'softB', label: '柔影模糊', min: 0, max: 24, step: 1, unit: 'px' },
    { g: 'grp-shadow', k: 'softS', label: '柔影收缩', min: 0, max: 10, step: .5, unit: 'px' },
    { g: 'grp-shadow', k: 'softA', label: '柔影墨度', min: 0, max: .5, step: .01 }
  ];

  var P = Object.assign({}, DEFS);
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) { Object.assign(P, saved); }
  } catch (e) {}

  /* ---- 参数 → CSS 变量 ---- */
  var VARS = {
    r: '--r', bv: '--bv', hiA: '--hi-a', loA: '--lo-a', ang: '--ang',
    shStatic: '--sh-static', shA: '--sh-a', shEdge: '--sh-edge', shW: '--sh-w', shAng: '--sh-ang', shDur: '--sh-dur',
    emX: '--em-x', emHi: '--em-hi', emLo: '--em-lo',
    edge: '--edge', edgeA: '--edge-a', softY: '--soft-y', softB: '--soft-b', softS: '--soft-s', softA: '--soft-a'
  };

  function apply() {
    Object.keys(VARS).forEach(function (k) {
      shell.style.setProperty(VARS[k], String(P[k]));
    });
    var sign = P.emMode === 'engraved' ? 1 : -1;
    shell.style.setProperty('--em-fx', (sign * P.emX).toFixed(2) + 'px');
    shell.style.setProperty('--em-fy', (sign * P.emX).toFixed(2) + 'px');
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
    render();
  }

  /* ---- 控件 ---- */
  var outs = {};

  CTLS.forEach(function (c) {
    var wrap = document.createElement('div');
    wrap.className = 'ctl';
    var lab = document.createElement('label');
    lab.innerHTML = '<span>' + c.label + '</span>';
    var out = document.createElement('output');
    lab.appendChild(out);
    var inp = document.createElement('input');
    inp.type = 'range';
    inp.min = c.min; inp.max = c.max; inp.step = c.step;
    inp.value = P[c.k];
    inp.addEventListener('input', function () {
      P[c.k] = parseFloat(inp.value);
      apply();
    });
    outs[c.k] = function () {
      out.textContent = (Math.round(P[c.k] * 100) / 100) + (c.unit || '');
    };
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    document.getElementById(c.g).appendChild(wrap);
  });

  /* 浮雕模式 */
  var modeWrap = document.createElement('div');
  modeWrap.className = 'ctl';
  modeWrap.innerHTML =
    '<label><span>浮雕模式</span></label>' +
    '<select id="em-mode">' +
    '<option value="engraved">凹刻（光在右下）</option>' +
    '<option value="raised">凸起（光在左上）</option>' +
    '</select>';
  document.getElementById('grp-emboss').prepend(modeWrap);
  var modeSel = modeWrap.querySelector('select');
  modeSel.value = P.emMode;
  modeSel.addEventListener('change', function () {
    P.emMode = modeSel.value;
    apply();
  });

  /* ---- 导出 ---- */
  function n(x) { return String(Math.round(x * 100) / 100); }

  function exportCss() {
    var s = P.emMode === 'engraved' ? 1 : -1;
    var ox = n(s * P.emX), oy = n(s * P.emX);
    var nx = n(-s * P.emX), ny = n(-s * P.emX);
    return [
      '/* 铭牌键参数 · tools/plate-tuner.html 导出 */',
      '  border-radius: ' + n(P.r) + 'px;',
      '  background: linear-gradient(' + n(P.ang) + 'deg, var(--plate-hi) 0%, var(--plate-lo) 100%);',
      '  box-shadow:',
      '    inset ' + n(P.bv) + 'px ' + n(P.bv) + 'px 0 rgba(255,255,255,' + n(P.hiA) + '),',
      '    inset ' + n(-P.bv) + 'px ' + n(-P.bv) + 'px 0 rgba(18,23,26,' + n(P.loA) + '),',
      '    0 ' + n(P.edge) + 'px 0 rgba(18,23,26,' + n(P.edgeA) + '),',
      '    0 ' + n(P.softY) + 'px ' + n(P.softB) + 'px ' + n(-P.softS) + 'px rgba(18,23,26,' + n(P.softA) + ');',
      '',
      '/* 静止进光（左上角，118°） */',
      '  opacity(::before): ' + n(P.shStatic) + ';',
      '',
      '/* 悬停扫光：220% 背景、从左到右只扫一次 */',
      '  ::after { background-size: 220% 100%; animation: plate-sweep ' + n(P.shDur) + 's forwards; }',
      '  ::after 渐变：透明 → rgba(18,23,26,' + n(P.shEdge) + ') ' + n(50 - P.shW / 4) + '% → rgba(255,255,255,' + n(P.shA) + ') 50% → rgba(18,23,26,' + n(P.shEdge) + ') ' + n(50 + P.shW / 4) + '% → 透明',
      '  两端透明点：' + n(50 - P.shW / 2) + '% / ' + n(50 + P.shW / 2) + '%；扫完停在 0%，离开不抽回',
      '',
      '/* 浮雕 */',
      '  filter: drop-shadow(' + ox + 'px ' + oy + 'px 0 rgba(255,255,255,' + n(P.emHi) + '))',
      '          drop-shadow(' + nx + 'px ' + ny + 'px 0 rgba(18,23,26,' + n(P.emLo) + '));'
    ].join('\n');
  }

  var pre = document.getElementById('css');
  function render() {
    outs && Object.keys(outs).forEach(function (k) { if (outs[k]) { outs[k](); } });
    modeSel.value = P.emMode;
    pre.textContent = exportCss();
  }

  apply();

  document.getElementById('reset').addEventListener('click', function () {
    Object.assign(P, DEFS);
    try { localStorage.removeItem(KEY); } catch (e) {}
    document.querySelectorAll('.ctl input[type="range"]').forEach(function (inp, i) {
      inp.value = P[CTLS[i].k];
    });
    modeSel.value = P.emMode;
    apply();
  });

  document.getElementById('copy').addEventListener('click', function () {
    var txt = exportCss();
    var done = function () {
      var b = document.getElementById('copy');
      var old = b.textContent;
      b.textContent = '已复制';
      setTimeout(function () { b.textContent = old; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    }
  });
}());
</script>
</body>
</html>
