<!DOCTYPE html>
<html lang="zh-CN" data-theme="cool">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>格子墙调参台 · ZLOONG（本地工具）</title>
<link rel="icon" href="../images/avatar.png">
<link rel="stylesheet" href="../css/tokens-screen.css">
<link rel="stylesheet" href="../css/site.css">
<style>
  /* 工具页自己的排版：屏的 token，哑光面，不引入新材质 */
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
  .bar {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--line-strong);
    font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  }
  .bar b { font-weight: 700; }
  .bar span { color: var(--fg-faint); }

  .layout { display: grid; grid-template-columns: 1fr 380px; min-height: calc(100vh - 49px); }

  .stage { padding: 28px 24px 44px; }
  .stage__hint {
    font-family: var(--mono); font-size: 13px; letter-spacing: .1em;
    color: var(--fg-faint); text-transform: uppercase; margin: 0 0 12px;
  }

  /* 预览就是纸面：冷白底，两层画布 */
  .preview {
    position: relative; width: 100%; aspect-ratio: 16 / 10;
    background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line-strong);
    overflow: hidden;
  }
  .preview--narrow { width: 320px; max-width: 100%; aspect-ratio: 3 / 4; }
  .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .preview canvas + canvas { z-index: 1; }
  .preview + .stage__hint { margin-top: 32px; }

  .panel {
    border-left: 1px solid var(--line-strong);
    padding: 20px 22px 32px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--surface);
    /* 控件多了要独立滚动，否则底部按钮够不着 */
    position: sticky; top: 0; align-self: start;
    max-height: 100vh; overflow-y: auto;
  }
  .panel h2 {
    margin: 12px 0 4px; font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--fg-dim);
  }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 4px 12px; align-items: center; margin: 6px 0; }
  .row label { font-size: 14px; color: var(--fg); }
  .row output {
    font-family: var(--mono); font-size: 13px; text-align: right; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--fg); height: 22px; }
  .row input[type="color"] {
    grid-column: 1 / -1; width: 100%; height: 28px; padding: 0;
    border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
  }
  .row input:disabled { opacity: .38; cursor: not-allowed; }
  .row--select { grid-template-columns: 1fr 40px; }
  .row--select select {
    grid-column: 1 / -1; width: 100%; padding: 8px 10px; margin-top: 2px;
    font: inherit; font-size: 13px; color: var(--fg); background: var(--btn-bg);
    border: 1px solid var(--line-strong); border-radius: 0;
  }

  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .actions button {
    font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    padding: 10px 16px; border: 0; cursor: pointer;
    background: var(--btn-bg); color: var(--fg);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(0,0,0,.12), 0 3px 10px rgba(18,23,26,.18);
  }
  .actions button:active { transform: translateY(2px); box-shadow: inset 0 2px 5px rgba(18,23,26,.14); }
  pre#out {
    margin: 16px 0 0; padding: 14px; overflow: auto; max-height: 340px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    background: var(--frame); color: var(--fg);
    white-space: pre-wrap; word-break: break-all;
  }
  .note { color: var(--fg-faint); font-size: 13px; line-height: 1.7; margin-top: 14px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .panel { border-left: 0; border-top: 1px solid var(--line-strong); }
  }
</style>
</head>
<body>

<div class="bar">
  <b>格子墙调参台</b>
  <span>本地工具 · 站内无入口 · 参数存 localStorage</span>
</div>

<div class="layout">
  <section class="stage">
    <p class="stage__hint">桌面档 · 在面板上移动指针 → 朱砂拖头、青绿尾巴</p>
    <div class="preview" id="preview-full"></div>

    <p class="stage__hint">窄屏档 · 同一组参数，只换格宽</p>
    <div class="preview preview--narrow" id="preview-narrow"></div>
  </section>

  <aside class="panel">
    <h2>墙</h2>
    <div id="sliders-wall"></div>

    <h2>热与痕迹</h2>
    <div id="sliders-ink"></div>

    <h2>字符（单色密度）</h2>
    <div id="sliders-glyph"></div>

    <h2>色带（色块模式）</h2>
    <div id="sliders-ramp"></div>

    <div class="actions">
      <button type="button" id="copy">复制导出</button>
      <button type="button" id="reset">重置</button>
    </div>

    <pre id="out"></pre>
    <p class="note">导出的常量粘回 <code>_lab/wall.js</code> 顶部。<b>字符密度</b>模式下热区的字沿阶梯逐档变密、墨色加深，到「实心阈值」整格填墨；色带那组会置灰。<b>色块</b>模式下按 <code>PALETTE</code> 取档，色带已按插值方式、提亮与提饱和算好，<code>wall.js</code> 不再做颜色运算。两种模式共用同一套热模型（注入、半径、余热、出块阈值）。</p>
  </aside>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'zloong-wall-tuner-v1';
  var GLYPHS = '<>/\\.,:;=+-*';
  var INK_RGB = '18, 23, 26';
  var INK_SOLID = '#12171A';
  var PAPER = (getComputedStyle(document.documentElement).getPropertyValue('--bg') || '').trim() || '#F2F5F7';
  var GROUPS = { wall: 'sliders-wall', ink: 'sliders-ink', glyph: 'sliders-glyph', ramp: 'sliders-ramp' };

  function hexToRgb(hex) {
    var h = String(hex).replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  function rgbToHex(c) {
    return '#' + c.map(function (v) {
      return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
    }).join('').toUpperCase();
  }

  function rgbToHsl(c) {
    var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
    if (d) {
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) { h = (g - b) / d + (g < b ? 6 : 0); }
      else if (mx === g) { h = (b - r) / d + 2; }
      else { h = (r - g) / d + 4; }
      h *= 60;
    }
    return [h, s, l];
  }

  function hslToRgb(hsl) {
    var h = hsl[0], s = hsl[1], l = hsl[2];
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }

  function mixRgb(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }

  /* 色相绕行：短弧走绿黄，长弧走蓝紫 */
  function mixHue(a, b, t, long) {
    var A = rgbToHsl(a), B = rgbToHsl(b);
    var dh = B[0] - A[0];
    if (long) {
      if (dh >= 0) { dh -= 360; } else { dh += 360; }
    } else if (dh > 180) {
      dh -= 360;
    } else if (dh < -180) {
      dh += 360;
    }
    return hslToRgb([(A[0] + dh * t + 360) % 360,
                     A[1] + (B[1] - A[1]) * t,
                     A[2] + (B[2] - A[2]) * t]);
  }

  function lift(c, dl, ds) {
    var h = rgbToHsl(c);
    h[1] = Math.min(1, Math.max(0, h[1] + ds));
    h[2] = Math.min(1, Math.max(0, h[2] + dl));
    return hslToRgb(h);
  }

  var RAMP = [];

  function buildRamp() {
    var cool = hexToRgb(P.coolHex);
    var hot = hexToRgb(P.hotHex);
    var tri = hexToRgb(P.triHex);
    var out = [];
    for (var i = 0; i < P.steps; i++) {
      var u = i / Math.max(1, P.steps - 1);
      var t = Math.pow(u, P.gamma);
      var c;
      if (P.rampMode === 'tri') {
        c = t < P.triPos
          ? mixRgb(cool, tri, t / Math.max(0.001, P.triPos))
          : mixRgb(tri, hot, (t - P.triPos) / Math.max(0.001, 1 - P.triPos));
      } else if (P.rampMode === 'hueShort' || P.rampMode === 'hueLong') {
        c = mixHue(cool, hot, t, P.rampMode === 'hueLong');
      } else {
        c = mixRgb(cool, hot, t);
      }
      var w = Math.sin(Math.PI * t);       /* 中段权重，两端为 0 */
      if (P.lBoost > 0 || P.satBoost > 0) { c = lift(c, w * P.lBoost, w * P.satBoost); }
      out.push(rgbToHex(c));
    }
    RAMP = out;
  }

  var DEFS = [
    { k: 'wallBase',  group: 'wall', label: '墙面最淡',    min: 0,    max: 0.14, step: 0.005, def: 0.04, dp: 3 },
    { k: 'wallBand',  group: 'wall', label: '起伏幅度',    min: 0,    max: 0.20, step: 0.005, def: 0.09, dp: 3 },
    { k: 'glyph',     group: 'wall', label: '字形 / 格宽', min: 0.40, max: 0.80, step: 0.02,  def: 0.56, dp: 2 },
    { k: 'fullCell',  group: 'wall', label: '桌面格宽',    min: 10,   max: 30,   step: 1,     def: 18,   dp: 0 },
    { k: 'narrowCell',group: 'wall', label: '窄屏格宽',    min: 8,    max: 20,   step: 1,     def: 12,   dp: 0 },

    { k: 'inkMode',   group: 'ink',  type: 'select', label: '表现方式', def: 'glyph',
      options: [['glyph', '字符密度（单色）'], ['block', '色块（色带）']] },
    { k: 'inject',    group: 'ink',  label: '每帧注入热',  min: 0.20, max: 1.20, step: 0.05,  def: 0.75, dp: 2 },
    { k: 'radius',    group: 'ink',  label: '热团半径',    min: 1.5,  max: 6,    step: 0.1,   def: 3.2,  dp: 1 },
    { k: 'decay',     group: 'ink',  label: '每帧余热',    min: 0.86, max: 0.985,step: 0.005, def: 0.94, dp: 3 },
    { k: 'cut',       group: 'ink',  label: '出块阈值',    min: 0.04, max: 0.30, step: 0.01,  def: 0.12, dp: 2 },
    { k: 'coolCut',   group: 'ink',  label: '全青绿上限',  min: 0.20, max: 0.90, step: 0.01,  def: 0.58, dp: 2 },
    { k: 'hotCut',    group: 'ink',  label: '全朱砂下限',  min: 0.20, max: 1.00, step: 0.01,  def: 0.80, dp: 2 },

    { k: 'glyphRamp', group: 'glyph', type: 'select', label: '字符阶梯', def: '.:-=+*#%@',
      options: [
        [':-=+*#%@', '经典 9 档'],
        [' .:-=+*#%@', '带空档 10 档'],
        ['0123456789ABCDEF', '十六进制 16 档'],
        ['/\\|-_=+*#%@', '符号堆积 11 档']
      ] },
    { k: 'glyphMin',  group: 'glyph', label: '最淡一档', min: 0.05, max: 0.60, step: 0.01, def: 0.24, dp: 2 },
    { k: 'glyphMax',  group: 'glyph', label: '最密一档', min: 0.40, max: 1.00, step: 0.01, def: 0.95, dp: 2 },
    { k: 'solidCut',  group: 'glyph', label: '实心阈值', min: 0.80, max: 1.00, step: 0.01, def: 0.97, dp: 2 },
    { k: 'solidScale',group: 'glyph', label: '实心档放大', min: 1.00, max: 2.00, step: 0.05, def: 1.60, dp: 2 },

    { k: 'coolHex',   group: 'ramp', type: 'color', label: '凉色（尾巴）', def: '#00827F' },
    { k: 'hotHex',    group: 'ramp', type: 'color', label: '热色（拖头）', def: '#8B2C1F' },
    { k: 'rampMode',  group: 'ramp', type: 'select', label: '插值方式', def: 'rgb',
      options: [
        ['rgb', 'RGB 直混（会过灰）'],
        ['hueShort', '色相短弧（经绿黄）'],
        ['hueLong', '色相长弧（经蓝紫）'],
        ['tri', '三色标（自定义中间色）']
      ] },
    { k: 'triHex',    group: 'ramp', type: 'color', label: '中间色', def: '#8A7716' },
    { k: 'triPos',    group: 'ramp', label: '中间色位置', min: 0.10, max: 0.90, step: 0.05, def: 0.50, dp: 2 },
    { k: 'lBoost',    group: 'ramp', label: '中段提亮',   min: 0,    max: 0.60, step: 0.02, def: 0.00, dp: 2 },
    { k: 'satBoost',  group: 'ramp', label: '中段提饱和', min: 0,    max: 0.60, step: 0.02, def: 0.00, dp: 2 },
    { k: 'gamma',     group: 'ramp', label: '色带偏向',   min: 0.40, max: 2.50, step: 0.05, def: 1.00, dp: 2 },
    { k: 'steps',     group: 'ramp', label: '色带档数',   min: 2,    max: 20,   step: 1,    def: 12,   dp: 0 }
  ];

  var P = {};
  DEFS.forEach(function (d) { P[d.k] = d.def; });

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    DEFS.forEach(function (d) {
      var v = saved[d.k];
      if (typeof v === 'number' ||
          ((d.type === 'color' || d.type === 'select') && typeof v === 'string')) { P[d.k] = v; }
    });
  } catch (e) { /* 隐私模式 */ }

  function hash(x, y) {
    var n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }

  /* ---------------- 预览实例：一套墙 + 一层色块 ---------------- */
  function makeField(host, cellKey) {
    var wall = document.createElement('canvas');
    var ink = document.createElement('canvas');
    host.appendChild(wall);
    host.appendChild(ink);

    var wc = wall.getContext('2d');
    var ic = ink.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0, cols = 0, rows = 0, cell = 18;
    var heat = null, buckets = [];
    var raf = 0, moved = false, inside = false, px = -999, py = -999;

    function drawWall() {
      wc.clearRect(0, 0, W, H);
      wc.font = Math.round(cell * P.glyph) + 'px "Cascadia Code", Consolas, ui-monospace, monospace';
      wc.textAlign = 'center';
      wc.textBaseline = 'middle';
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var h = hash(x, y);
          var band = 0.5 + 0.5 * Math.sin(x * 0.09) * Math.cos(y * 0.11);
          var a = P.wallBase + band * P.wallBand * (0.4 + h * 0.6);
          wc.fillStyle = 'rgba(' + INK_RGB + ',' + a.toFixed(3) + ')';
          wc.fillText(GLYPHS.charAt(Math.floor(h * GLYPHS.length)), x * cell + cell / 2, y * cell + cell / 2);
        }
      }
    }

    function size() {
      var r = host.getBoundingClientRect();
      W = r.width;
      H = r.height;
      cell = cellKey === 'narrow' ? P.narrowCell : P.fullCell;
      cols = Math.ceil(W / cell);
      rows = Math.ceil(H / cell);

      [wall, ink].forEach(function (c) {
        c.width = Math.round(W * dpr);
        c.height = Math.round(H * dpr);
        c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
      });

      heat = new Float32Array(cols * rows);
      drawWall();
      ic.clearRect(0, 0, W, H);
    }

    function poke() {
      var R = P.radius;
      var cx = px / cell, cy = py / cell;
      var x0 = Math.max(0, Math.floor(cx - R - 1));
      var x1 = Math.min(cols - 1, Math.ceil(cx + R + 1));
      var y0 = Math.max(0, Math.floor(cy - R - 1));
      var y1 = Math.min(rows - 1, Math.ceil(cy + R + 1));
      for (var y = y0; y <= y1; y++) {
        for (var x = x0; x <= x1; x++) {
          var dx = x - cx, dy = y - cy;
          var d = Math.sqrt(dx * dx + dy * dy);
          var v = 1 - d / (R + hash(x, y) * 1.6);
          if (v > 0) {
            var i = y * cols + x;
            heat[i] = Math.min(1, heat[i] + v * P.inject);
          }
        }
      }
    }

    function paint() {
      ic.clearRect(0, 0, W, H);
      return P.inkMode === 'glyph' ? paintGlyph() : paintBlock();
    }

    /* 单色密度：热区的字逐档变密、变深，最热一档整格实心 */
    function paintGlyph() {
      var ramp = P.glyphRamp;
      var n = ramp.length;
      var cx, cy, h, t, lv;
      var painted = 0;

      ic.textAlign = 'center';
      ic.textBaseline = 'middle';
      ic.fillStyle = PAPER;
      ic.globalAlpha = 1;

      /* 普通档 */
      ic.font = Math.round(cell * P.glyph) + 'px "Cascadia Code", Consolas, ui-monospace, monospace';
      for (var y = 0; y < rows; y++) {
        var row = y * cols;
        for (var x = 0; x < cols; x++) {
          h = heat[row + x];
          if (h <= P.cut || h >= P.solidCut) { continue; }
          cx = x * cell;
          cy = y * cell;
          /* 先盖掉墙上的原字，否则新旧字形叠成双影 */
          ic.fillRect(cx, cy, cell, cell);
          t = (h - P.cut) / (1 - P.cut);
          lv = Math.floor(t * n);
          if (lv > n - 1) { lv = n - 1; }
          ic.globalAlpha = P.glyphMin + t * (P.glyphMax - P.glyphMin);
          ic.fillStyle = INK_SOLID;
          ic.fillText(ramp.charAt(lv), cx + cell / 2, cy + cell / 2);
          ic.globalAlpha = 1;
          ic.fillStyle = PAPER;
          painted++;
        }
      }

      /* 实心档：最密的字放大到接近整格 */
      ic.font = Math.round(cell * P.glyph * P.solidScale) + 'px "Cascadia Code", Consolas, ui-monospace, monospace';
      for (var y2 = 0; y2 < rows; y2++) {
        var row2 = y2 * cols;
        for (var x2 = 0; x2 < cols; x2++) {
          h = heat[row2 + x2];
          if (h < P.solidCut) { continue; }
          cx = x2 * cell;
          cy = y2 * cell;
          ic.fillRect(cx, cy, cell, cell);
          ic.fillStyle = INK_SOLID;
          ic.fillText(ramp.charAt(n - 1), cx + cell / 2, cy + cell / 2);
          ic.fillStyle = PAPER;
          painted++;
        }
      }

      ic.globalAlpha = 1;
      return painted;
    }

    /* 色块：按色带取档 */
    function paintBlock() {
      var n = RAMP.length;
      while (buckets.length < n) { buckets.push([]); }
      buckets.length = n;
      for (var b = 0; b < n; b++) { buckets[b].length = 0; }

      var painted = 0;
      var span = Math.max(0.02, P.hotCut - P.coolCut);
      for (var y = 0; y < rows; y++) {
        var row = y * cols;
        for (var x = 0; x < cols; x++) {
          var h = heat[row + x];
          if (h <= P.cut) { continue; }
          var t = (h - P.coolCut) / span;
          t = t <= 0 ? 0 : t >= 1 ? 1 : t;
          var step = Math.round(t * (n - 1));
          buckets[step].push(x, y, h);
          painted++;
        }
      }
      for (var b2 = 0; b2 < n; b2++) {
        var list = buckets[b2];
        if (!list.length) { continue; }
        ic.fillStyle = RAMP[b2];
        for (var k = 0; k < list.length; k += 3) {
          ic.globalAlpha = Math.min(0.96, 0.18 + list[k + 2] * 1.15);
          ic.fillRect(list[k] * cell + 0.5, list[k + 1] * cell + 0.5, cell - 1, cell - 1);
        }
      }
      ic.globalAlpha = 1;
      return painted;
    }

    function frame() {
      raf = 0;
      var alive = 0;
      for (var i = 0; i < heat.length; i++) {
        heat[i] *= P.decay;
        if (heat[i] < 0.02) { heat[i] = 0; } else if (heat[i] > P.cut) { alive++; }
      }
      if (moved) { poke(); moved = false; }
      var painted = paint();
      if (painted > 0 || alive > 0) { raf = requestAnimationFrame(frame); }
    }

    function start() {
      if (raf) { return; }
      raf = requestAnimationFrame(frame);
    }

    host.addEventListener('pointermove', function (e) {
      var r = wall.getBoundingClientRect();
      px = e.clientX - r.left;
      py = e.clientY - r.top;
      inside = px >= 0 && py >= 0 && px <= W && py <= H;
      if (inside) { moved = true; start(); }
    }, { passive: true });

    var ro = new ResizeObserver(function () { size(); });
    ro.observe(host);

    size();

    return {
      redraw: function (wallChanged) {
        if (wallChanged) { size(); }
      }
    };
  }

  var fields = [
    makeField(document.getElementById('preview-full'), 'full'),
    makeField(document.getElementById('preview-narrow'), 'narrow')
  ];

  /* ---------------- 控件 ---------------- */
  var inputs = {};
  var outputs = {};

  DEFS.forEach(function (d) {
    var row = document.createElement('div');
    row.className = 'row';

    var label = document.createElement('label');
    label.htmlFor = d.k;
    label.textContent = d.label;

    var isColor = d.type === 'color';
    var isSelect = d.type === 'select';
    var fmt = function (v) {
      if (isColor) { return v.toUpperCase(); }
      if (isSelect) { return ''; }
      return v.toFixed(d.dp);
    };

    var out = document.createElement('output');
    out.id = d.k + '-v';
    out.textContent = fmt(P[d.k]);

    var input;
    if (isSelect) {
      input = document.createElement('select');
      d.options.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o[0];
        opt.textContent = o[1];
        input.appendChild(opt);
      });
      row.classList.add('row--select');
    } else {
      input = document.createElement('input');
      if (isColor) {
        input.type = 'color';
      } else {
        input.type = 'range';
        input.min = d.min;
        input.max = d.max;
        input.step = d.step;
      }
    }
    input.id = d.k;
    input.value = P[d.k];

    row.appendChild(label);
    row.appendChild(out);
    row.appendChild(input);
    document.getElementById(GROUPS[d.group]).appendChild(row);

    inputs[d.k] = input;
    outputs[d.k] = { el: out, d: d, isColor: isColor, isSelect: isSelect };

    input.addEventListener('input', function () {
      P[d.k] = (isColor || isSelect) ? input.value : parseFloat(input.value);
      out.textContent = fmt(P[d.k]);

      /* 两个阈值不能交叉 */
      if (d.k === 'coolCut' && P.hotCut <= P.coolCut) {
        P.hotCut = Math.min(1, +(P.coolCut + 0.02).toFixed(2));
        inputs.hotCut.value = P.hotCut;
        outputs.hotCut.el.textContent = P.hotCut.toFixed(2);
      }
      if (d.k === 'hotCut' && P.hotCut <= P.coolCut) {
        P.coolCut = Math.max(0.2, +(P.hotCut - 0.02).toFixed(2));
        inputs.coolCut.value = P.coolCut;
        outputs.coolCut.el.textContent = P.coolCut.toFixed(2);
      }

      save();
      render(!!WALL_KEYS[d.k]);
    });
  });

  var WALL_KEYS = { wallBase: 1, wallBand: 1, glyph: 1, fullCell: 1, narrowCell: 1 };

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* 隐私模式 */ }
  }

  var MODE_LABEL = { rgb: 'RGB 直混', hueShort: '色相短弧', hueLong: '色相长弧', tri: '三色标' };

  var GLYPH_ONLY = { glyphRamp: 1, glyphMin: 1, glyphMax: 1, solidCut: 1, solidScale: 1 };
  var BLOCK_ONLY = {
    coolCut: 1, hotCut: 1, coolHex: 1, hotHex: 1, rampMode: 1,
    triHex: 1, triPos: 1, lBoost: 1, satBoost: 1, gamma: 1, steps: 1
  };

  function syncEnabled() {
    var glyph = P.inkMode === 'glyph';
    DEFS.forEach(function (d) {
      if (!inputs[d.k]) { return; }
      inputs[d.k].disabled = !!(glyph ? BLOCK_ONLY[d.k] : GLYPH_ONLY[d.k]);
    });
    if (!glyph) {
      var tri = P.rampMode === 'tri';
      if (inputs.triHex) { inputs.triHex.disabled = !tri; }
      if (inputs.triPos) { inputs.triPos.disabled = !tri; }
    }
  }

  function jsStr(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function exportText() {
    return '/* _lab/wall.js（由 tools/wall-tuner.html 导出） */\n' +
      'var FULL_CELL = ' + P.fullCell + ';\n' +
      'var NARROW_CELL = ' + P.narrowCell + ';\n' +
      'var GLYPH = ' + P.glyph.toFixed(2) + ';\n' +
      'var WALL_BASE = ' + P.wallBase.toFixed(3) + ';\n' +
      'var WALL_BAND = ' + P.wallBand.toFixed(3) + ';\n' +
      'var INJECT = ' + P.inject.toFixed(2) + ';\n' +
      'var RADIUS = ' + P.radius.toFixed(1) + ';\n' +
      'var DECAY = ' + P.decay.toFixed(3) + ';\n' +
      'var CUT = ' + P.cut.toFixed(2) + ';\n' +
      'var COOL_CUT = ' + P.coolCut.toFixed(2) + ';\n' +
      'var HOT_CUT = ' + P.hotCut.toFixed(2) + ';\n' +
      '\n' +
      "/* 表现方式：glyph 单色密度 / block 色块 */\n" +
      "var INK_MODE = '" + jsStr(P.inkMode) + "';\n" +
      "var GLYPH_RAMP = '" + jsStr(P.glyphRamp) + "';\n" +
      'var GLYPH_MIN = ' + P.glyphMin.toFixed(2) + ';\n' +
      'var GLYPH_MAX = ' + P.glyphMax.toFixed(2) + ';\n' +
      'var SOLID_CUT = ' + P.solidCut.toFixed(2) + ';\n' +
      'var SOLID_SCALE = ' + P.solidScale.toFixed(2) + ';\n' +
      '\n' +
      '/* 色带：' + P.coolHex.toUpperCase() + ' → ' + P.hotHex.toUpperCase() +
      ' · ' + MODE_LABEL[P.rampMode] + ' · ' + P.steps + ' 档 */\n' +
      'var PALETTE = [\n  ' + RAMP.map(function (c) { return "'" + c + "'"; }).join(', ') + '\n];\n' +
      'var STEPS = PALETTE.length;\n';
  }

  function render(wallChanged) {
    if (wallChanged === undefined) { wallChanged = true; }
    buildRamp();
    syncEnabled();
    document.getElementById('out').textContent = exportText();
    fields.forEach(function (f) { f.redraw(wallChanged); });
  }

  var copyBtn = document.getElementById('copy');
  var resetBtn = document.getElementById('reset');
  var timer = 0;

  function flash(text) {
    copyBtn.textContent = text;
    clearTimeout(timer);
    timer = setTimeout(function () { copyBtn.textContent = '复制导出'; }, 1400);
  }

  copyBtn.addEventListener('click', function () {
    var text = exportText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash('已复制'); }, function () { flash('复制失败'); });
    } else {
      flash('复制失败');
    }
  });

  resetBtn.addEventListener('click', function () {
    DEFS.forEach(function (d) {
      P[d.k] = d.def;
      inputs[d.k].value = d.def;
      outputs[d.k].el.textContent = outputs[d.k].isColor
        ? String(d.def).toUpperCase()
        : outputs[d.k].isSelect ? '' : d.def.toFixed(d.dp);
    });
    save();
    render(true);
  });

  render(true);
}());
</script>
</body>
</html>
