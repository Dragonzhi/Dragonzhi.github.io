<!DOCTYPE html>
<html lang="zh-CN" data-theme="cool">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>格子墙调参台 · ZLOONG（本地工具）</title>
<link rel="icon" href="../images/avatar.png">
<link rel="stylesheet" href="../css/tokens-screen.css">
<link rel="stylesheet" href="../css/site.css">
<style>
  /* 工具页自己的排版：屏的 token，哑光面，不引入新材质 */
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
  .bar {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--line-strong);
    font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  }
  .bar b { font-weight: 700; }
  .bar span { color: var(--fg-faint); }

  .layout { display: grid; grid-template-columns: 1fr 380px; min-height: calc(100vh - 49px); }

  .stage { padding: 28px 24px 44px; }
  .stage__hint {
    font-family: var(--mono); font-size: 13px; letter-spacing: .1em;
    color: var(--fg-faint); text-transform: uppercase; margin: 0 0 12px;
  }

  /* 预览就是纸面：冷白底，一面墙自己走浪 */
  .preview {
    position: relative; width: 100%; aspect-ratio: 16 / 10;
    background: var(--bg);
    box-shadow: inset 0 0 0 1px var(--line-strong);
    overflow: hidden;
  }
  .preview--narrow { width: 320px; max-width: 100%; aspect-ratio: 3 / 4; }
  .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .preview + .stage__hint { margin-top: 32px; }

  .panel {
    border-left: 1px solid var(--line-strong);
    padding: 20px 22px 32px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--surface);
    /* 控件多了要独立滚动，否则底部按钮够不着 */
    position: sticky; top: 0; align-self: start;
    max-height: 100vh; overflow-y: auto;
  }
  .panel h2 {
    margin: 12px 0 4px; font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--fg-dim);
  }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 4px 12px; align-items: center; margin: 6px 0; }
  .row label { font-size: 14px; color: var(--fg); }
  .row output {
    font-family: var(--mono); font-size: 13px; text-align: right; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--fg); height: 22px; }
  .row input[type="color"] {
    grid-column: 1 / -1; width: 100%; height: 28px; padding: 0;
    border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
  }
  .row input:disabled { opacity: .38; cursor: not-allowed; }
  .row--select { grid-template-columns: 1fr 40px; }
  .row--select select {
    grid-column: 1 / -1; width: 100%; padding: 8px 10px; margin-top: 2px;
    font: inherit; font-size: 13px; color: var(--fg); background: var(--btn-bg);
    border: 1px solid var(--line-strong); border-radius: 0;
  }

  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .actions button {
    font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    padding: 10px 16px; border: 0; cursor: pointer;
    background: var(--btn-bg); color: var(--fg);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(0,0,0,.12), 0 3px 10px rgba(18,23,26,.18);
  }
  .actions button:active { transform: translateY(2px); box-shadow: inset 0 2px 5px rgba(18,23,26,.14); }
  pre#out {
    margin: 16px 0 0; padding: 14px; overflow: auto; max-height: 340px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    background: var(--frame); color: var(--fg);
    white-space: pre-wrap; word-break: break-all;
  }
  .note { color: var(--fg-faint); font-size: 13px; line-height: 1.7; margin-top: 14px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .panel { border-left: 0; border-top: 1px solid var(--line-strong); }
  }
</style>
</head>
<body>

<div class="bar">
  <b>格子墙调参台</b>
  <span>本地工具 · 站内无入口 · 参数存 localStorage</span>
</div>

<div class="layout">
  <section class="stage">
    <p class="stage__hint">桌面档 · 浪沿 118° 光向从左上推向右下</p>
    <div class="preview" id="preview-full"></div>

    <p class="stage__hint">窄屏档 · 同一组参数，只换格宽</p>
    <div class="preview preview--narrow" id="preview-narrow"></div>
  </section>

  <aside class="panel">
    <h2>墙</h2>
    <div id="sliders-wall"></div>

    <h2>浪潮</h2>
    <div id="sliders-tide"></div>

    <h2>字符（浪头）</h2>
    <div id="sliders-glyph"></div>

    <div class="actions">
      <button type="button" id="copy">复制导出</button>
      <button type="button" id="reset">重置</button>
    </div>

    <pre id="out"></pre>
    <p class="note">导出的常量粘回 <code>js/wall.js</code> 顶部。墙的墨色深浅与字形由 sin 场驱动，不与指针互动：透明度 = 底墨 + 浪幅 + 静态薄厚；高于「浪头阈值」的格子换密字并泛青，低于「换字阈值」的格子趁最暗换字。方向、波长、薄厚与格宽的改动会重建整面墙，其余参数下一帧即生效。</p>
  </aside>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'zloong-wall-tuner-v2';
  var GLYPHS = '<>/\\.,:;=+-*';
  var INK_RGB = '18, 23, 26';
  var GROUPS = { wall: 'sliders-wall', tide: 'sliders-tide', glyph: 'sliders-glyph' };

  function hexToRgb(hex) {
    var h = String(hex).replace('#', '');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }

  var DEFS = [
    { k: 'base',      group: 'wall', label: '底墨（波谷）', min: 0,    max: 0.20, step: 0.005, def: 0.10, dp: 3 },
    { k: 'band',      group: 'wall', label: '静态薄厚',     min: 0,    max: 0.25, step: 0.005, def: 0.10, dp: 3 },
    { k: 'glyph',     group: 'wall', label: '字形 / 格宽',  min: 0.40, max: 0.80, step: 0.02,  def: 0.50, dp: 2 },
    { k: 'fullCell',  group: 'wall', label: '桌面格宽',     min: 10,   max: 30,   step: 1,     def: 24,   dp: 0 },
    { k: 'narrowCell',group: 'wall', label: '窄屏格宽',     min: 8,    max: 24,   step: 1,     def: 20,   dp: 0 },

    { k: 'angle',     group: 'tide', label: '推进方向（°）', min: 0,    max: 360,  step: 2,    def: 118,  dp: 0 },
    { k: 'wavelen',   group: 'tide', label: '波长（px）',   min: 200,  max: 1400, step: 20,   def: 780,  dp: 0 },
    { k: 'speed',     group: 'tide', label: '相速（rad/s）', min: 0.05, max: 2,    step: 0.05, def: 0.55, dp: 2 },
    { k: 'cross',     group: 'tide', label: '横向慢涌',     min: 0,    max: 1,    step: 0.02, def: 0.38, dp: 2 },
    { k: 'amp',       group: 'tide', label: '浪幅',         min: 0,    max: 0.70, step: 0.01, def: 0.34, dp: 2 },
    { k: 'crestCut',  group: 'tide', label: '浪头阈值',     min: 0.30, max: 0.95, step: 0.01, def: 0.74, dp: 2 },
    { k: 'crestMax',  group: 'tide', label: '浪头最深',     min: 0.60, max: 1.00, step: 0.01, def: 0.92, dp: 2 },
    { k: 'trough',    group: 'tide', label: '换字阈值',     min: 0,    max: 0.40, step: 0.02, def: 0.16, dp: 2 },

    { k: 'glyphRamp', group: 'glyph', type: 'select', label: '浪头字阶', def: ':-=+*#%@',
      options: [
        [':-=+*#%@', '经典 9 档'],
        [' .:-=+*#%@', '带空档 10 档'],
        ['0123456789ABCDEF', '十六进制 16 档'],
        ['/\\|-_=+*#%@', '符号堆积 11 档']
      ] },
    { k: 'crestHex',  group: 'glyph', type: 'color', label: '浪头色', def: '#206564' }
  ];

  var P = {};
  DEFS.forEach(function (d) { P[d.k] = d.def; });

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    DEFS.forEach(function (d) {
      var v = saved[d.k];
      if (typeof v === 'number' ||
          ((d.type === 'color' || d.type === 'select') && typeof v === 'string')) { P[d.k] = v; }
    });
  } catch (e) { /* 隐私模式 */ }

  function hash(x, y) {
    var n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return n - Math.floor(n);
  }

  /* ---------------- 预览实例：一面自己走浪的墙 ---------------- */
  function makeField(host, cellKey) {
    var wall = document.createElement('canvas');
    host.appendChild(wall);
    var c = wall.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0, cols = 0, rows = 0, cell = 16;
    var jit = null, band = null, glyphIdx = null, lastK = null, clock = null;
    var colU = null, colC = null, rowP = null;
    var raf = 0, lastPaint = 0;

    function size() {
      var r = host.getBoundingClientRect();
      W = r.width;
      H = r.height;
      cell = cellKey === 'narrow' ? P.narrowCell : P.fullCell;
      cols = Math.max(1, Math.ceil(W / cell));
      rows = Math.max(1, Math.ceil(H / cell));
      wall.width = Math.round(W * dpr);
      wall.height = Math.round(H * dpr);
      c.setTransform(dpr, 0, 0, dpr, 0, 0);

      var n = cols * rows;
      jit = new Float32Array(n);
      band = new Float32Array(n);
      glyphIdx = new Uint8Array(n);
      lastK = new Int32Array(n);
      clock = new Float32Array(n);
      for (var y = 0; y < rows; y++) {
        for (var x = 0; x < cols; x++) {
          var i = y * cols + x;
          var h = hash(x, y);
          jit[i] = h * 1.9;
          band[i] = P.band * (0.5 + 0.5 * Math.sin(x * 0.09) * Math.cos(y * 0.11)) * (0.4 + h * 0.6);
          glyphIdx[i] = Math.floor(h * GLYPHS.length) % GLYPHS.length;
          clock[i] = h * 9.7;
        }
      }
      var rad = P.angle * Math.PI / 180;
      var ux = Math.sin(rad), uy = -Math.cos(rad);
      var K = Math.PI * 2 / Math.max(120, P.wavelen);
      colU = new Float32Array(cols);
      colC = new Float32Array(cols);
      for (var x2 = 0; x2 < cols; x2++) {
        colU[x2] = x2 * cell * ux * K;
        colC[x2] = x2 * cell * 0.004;
      }
      rowP = new Float32Array(rows);
      for (var y2 = 0; y2 < rows; y2++) {
        rowP[y2] = y2 * cell * uy * K;
      }

      c.font = Math.round(cell * P.glyph) + 'px "Cascadia Code", Consolas, ui-monospace, monospace';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
    }

    function paint(t) {
      c.clearRect(0, 0, W, H);
      var phase = P.speed * t;
      var span = 1 - P.crestCut;
      var ramp = P.glyphRamp;
      var rc = ramp.length;
      var crest = hexToRgb(P.crestHex).join(', ');
      for (var y = 0; y < rows; y++) {
        var dy = y * cell;
        var rp = rowP[y];
        var rw = dy * 0.006 + phase * 0.37;
        var rowBase = y * cols;
        for (var x = 0; x < cols; x++) {
          var i = rowBase + x;
          var v = 0.5 + 0.5 * Math.sin(
            colU[x] + rp - phase +
            P.cross * Math.sin(rw + colC[x]) +
            jit[i] * 0.35
          );
          if (v < P.trough) {
            /* 波谷换字：钟走到整点才换，藏在最暗处 */
            var ck = (phase * 0.12 + clock[i]) | 0;
            if (ck !== lastK[i]) {
              lastK[i] = ck;
              glyphIdx[i] = ((clock[i] * 12.9 + ck * 78.2) % 1) * GLYPHS.length | 0;
            }
          }
          var a = P.base + P.amp * v + band[i];
          if (v > P.crestCut) {
            var ct2 = (v - P.crestCut) / span;
            a += ct2 * (P.crestMax - a);
            if (a > 1) { a = 1; }
            c.fillStyle = 'rgba(' + crest + ',' + a.toFixed(3) + ')';
            c.fillText(ramp.charAt(Math.min(rc - 1, (ct2 * rc) | 0)), x * cell + cell / 2, dy + cell / 2);
          } else {
            c.fillStyle = 'rgba(' + INK_RGB + ',' + a.toFixed(3) + ')';
            c.fillText(GLYPHS.charAt(glyphIdx[i]), x * cell + cell / 2, dy + cell / 2);
          }
        }
      }
    }

    function frame(now) {
      raf = 0;
      if (now - lastPaint >= 31) { lastPaint = now; paint(now / 1000); }
      raf = requestAnimationFrame(frame);
    }

    var ro = new ResizeObserver(function () { size(); });
    ro.observe(host);
    size();
    raf = requestAnimationFrame(frame);

    return {
      redraw: function (wallChanged) {
        if (wallChanged) { size(); }
      }
    };
  }

  var fields = [
    makeField(document.getElementById('preview-full'), 'full'),
    makeField(document.getElementById('preview-narrow'), 'narrow')
  ];

  /* ---------------- 控件 ---------------- */
  var inputs = {};
  var outputs = {};

  /* 这些参数烙在每格常量与行/列相位里，改了要重建 */
  var WALL_KEYS = { band: 1, glyph: 1, fullCell: 1, narrowCell: 1, angle: 1, wavelen: 1 };

  DEFS.forEach(function (d) {
    var row = document.createElement('div');
    row.className = 'row';

    var label = document.createElement('label');
    label.htmlFor = d.k;
    label.textContent = d.label;

    var isColor = d.type === 'color';
    var isSelect = d.type === 'select';
    var fmt = function (v) {
      if (isColor) { return v.toUpperCase(); }
      if (isSelect) { return ''; }
      return v.toFixed(d.dp);
    };

    var out = document.createElement('output');
    out.id = d.k + '-v';
    out.textContent = fmt(P[d.k]);

    var input;
    if (isSelect) {
      input = document.createElement('select');
      d.options.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o[0];
        opt.textContent = o[1];
        input.appendChild(opt);
      });
      row.classList.add('row--select');
    } else {
      input = document.createElement('input');
      if (isColor) {
        input.type = 'color';
      } else {
        input.type = 'range';
        input.min = d.min;
        input.max = d.max;
        input.step = d.step;
      }
    }
    input.id = d.k;
    input.value = P[d.k];

    row.appendChild(label);
    row.appendChild(out);
    row.appendChild(input);
    document.getElementById(GROUPS[d.group]).appendChild(row);

    inputs[d.k] = input;
    outputs[d.k] = { el: out, d: d, isColor: isColor, isSelect: isSelect };

    input.addEventListener('input', function () {
      P[d.k] = (isColor || isSelect) ? input.value : parseFloat(input.value);
      out.textContent = fmt(P[d.k]);
      save();
      render(!!WALL_KEYS[d.k]);
    });
  });

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* 隐私模式 */ }
  }

  function jsStr(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function exportText() {
    var crest = hexToRgb(P.crestHex);
    return '/* js/wall.js（由 tools/wall-tuner.html 导出） */\n' +
      'var FULL_CELL = ' + P.fullCell + ';\n' +
      'var NARROW_CELL = ' + P.narrowCell + ';\n' +
      'var GLYPH = ' + P.glyph.toFixed(2) + ';\n' +
      'var BASE = ' + P.base.toFixed(3) + ';\n' +
      'var BAND = ' + P.band.toFixed(3) + ';\n' +
      '\n' +
      '/* 浪：沿 ANGLE 光向推进，横向慢涌把浪头揉弯 */\n' +
      'var ANGLE = ' + P.angle + ';\n' +
      'var WAVELEN = ' + P.wavelen + ';\n' +
      'var SPEED = ' + P.speed.toFixed(2) + ';\n' +
      'var CROSS = ' + P.cross.toFixed(2) + ';\n' +
      'var AMP = ' + P.amp.toFixed(2) + ';\n' +
      'var CREST_CUT = ' + P.crestCut.toFixed(2) + ';\n' +
      'var CREST_MAX = ' + P.crestMax.toFixed(2) + ';\n' +
      'var TROUGH = ' + P.trough.toFixed(2) + ';\n' +
      "var GLYPH_RAMP = '" + jsStr(P.glyphRamp) + "';\n" +
      "var CREST = '" + crest.join(', ') + "';   /* " + P.crestHex.toUpperCase() + " */\n";
  }

  function render(wallChanged) {
    if (wallChanged === undefined) { wallChanged = true; }
    document.getElementById('out').textContent = exportText();
    fields.forEach(function (f) { f.redraw(wallChanged); });
  }

  var copyBtn = document.getElementById('copy');
  var resetBtn = document.getElementById('reset');
  var timer = 0;

  function flash(text) {
    copyBtn.textContent = text;
    clearTimeout(timer);
    timer = setTimeout(function () { copyBtn.textContent = '复制导出'; }, 1400);
  }

  copyBtn.addEventListener('click', function () {
    var text = exportText();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash('已复制'); }, function () { flash('复制失败'); });
    } else {
      flash('复制失败');
    }
  });

  resetBtn.addEventListener('click', function () {
    DEFS.forEach(function (d) {
      P[d.k] = d.def;
      inputs[d.k].value = d.def;
      outputs[d.k].el.textContent = outputs[d.k].isColor
        ? String(d.def).toUpperCase()
        : outputs[d.k].isSelect ? '' : d.def.toFixed(d.dp);
    });
    save();
    render(true);
  });

  render(true);
}());
</script>
</body>
</html>
