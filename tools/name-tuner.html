<!DOCTYPE html>
<html lang="zh-CN" data-theme="cool">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>主名浮雕调参台 · ZLOONG（本地工具）</title>
<link rel="stylesheet" href="../css/tokens-screen.css">
<link rel="stylesheet" href="../css/site.css">
<style>
  /* 工具页自己的排版：屏的 token，哑光面，不引入新材质 */
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
  .bar {
    display: flex; align-items: baseline; gap: 16px;
    padding: 14px 24px; border-bottom: 1px solid var(--line-strong);
    font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  }
  .bar b { font-weight: 700; }
  .bar span { color: var(--fg-faint); }

  .layout { display: grid; grid-template-columns: 1fr 380px; min-height: calc(100vh - 49px); }

  .stage { padding: 56px 24px 48px; overflow: hidden; }
  .stage__hint {
    font-family: var(--mono); font-size: 13px; letter-spacing: .1em;
    color: var(--fg-faint); text-transform: uppercase; margin-bottom: 40px;
  }
  .stage .name { margin: 0; }
  .stage__mini { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); }
  .stage__mini .name { font-size: 60px; }

  .panel {
    border-left: 1px solid var(--line-strong);
    padding: 20px 22px 32px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--surface);
  }
  .panel h2 {
    margin: 12px 0 4px; font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--fg-dim);
  }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 4px 12px; align-items: center; margin: 6px 0; }
  .row label { font-size: 14px; color: var(--fg); }
  .row output {
    font-family: var(--mono); font-size: 13px; text-align: right; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .row input[type="range"] {
    grid-column: 1 / -1; width: 100%; accent-color: var(--fg); height: 22px;
  }
  .actions { display: flex; gap: 12px; margin-top: 16px; }
  .actions button {
    font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    padding: 10px 16px; border: 0; cursor: pointer;
    background: var(--btn-bg); color: var(--fg);
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(0,0,0,.12), 0 3px 10px rgba(18,23,26,.18);
  }
  .actions button:active { transform: translateY(2px); box-shadow: inset 0 2px 5px rgba(18,23,26,.14); }
  pre#out {
    margin: 16px 0 0; padding: 14px; overflow: auto; max-height: 300px;
    font-family: var(--mono); font-size: 12px; line-height: 1.6;
    background: var(--frame); color: var(--fg);
    white-space: pre-wrap; word-break: break-all;
  }
  .note { color: var(--fg-faint); font-size: 13px; line-height: 1.7; margin-top: 14px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .panel { border-left: 0; border-top: 1px solid var(--line-strong); }
  }
</style>
</head>
<body>

<div class="bar">
  <b>主名浮雕调参台</b>
  <span>本地工具 · 站内无入口 · 参数存 localStorage</span>
</div>

<div class="layout">
  <section class="stage">
    <p class="stage__hint">在页面上移动指针 → 试验带时差的微动</p>
    <h1 class="name">
      <span class="name-plate" id="plate">
        <span class="name-deep" aria-hidden="true">ZLOONG</span>
        <span class="name-solid" id="face">ZLOONG</span>
      </span>
      <em>Dragonzhi · 个人主页</em>
    </h1>

    <div class="stage__mini">
      <p class="stage__hint">窄屏档（60px）</p>
      <h1 class="name">
        <span class="name-plate" id="plate-mini">
          <span class="name-deep" aria-hidden="true">ZLOONG</span>
          <span class="name-solid" id="face-mini">ZLOONG</span>
        </span>
        <em>Dragonzhi · 个人主页</em>
      </h1>
    </div>
  </section>

  <aside class="panel">
    <h2>反光带</h2>
    <div id="sliders-gradient"></div>

    <h2>微动</h2>
    <div id="sliders-motion"></div>

    <div class="actions">
      <button type="button" id="copy">复制导出</button>
      <button type="button" id="reset">重置</button>
    </div>

    <pre id="out"></pre>
    <p class="note">导出的 CSS 粘回 <code>css/site.css</code> 的 <code>.name-solid</code>；JS 参数对应 <code>js/home.js</code> 的 <code>nameLift</code>。颜色不动：白 <code>#EDF2F4</code>、青 <code>#2FD3CB</code>、赤 <code>#E2533C</code>、墨 <code>#12171A</code>。</p>
  </aside>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'zloong-name-tuner-v1';
  var TEAL = '#2FD3CB', RED = '#E2533C', WHITE = '#EDF2F4', INK = '#12171A', INK2 = '#101518';

  /* 参数定义：范围、步长、默认值与站内现值一致 */
  var DEFS = [
    { k: 'size',    label: '背景尺寸',        min: 200, max: 420, step: 5,    def: 320,  unit: '%',  group: 'gradient' },
    { k: 'angle',   label: '光带角度',        min: 80,  max: 120, step: 1,    def: 102,  unit: 'deg', group: 'gradient' },
    { k: 'center',  label: '光带位置',        min: 30,  max: 60,  step: .1,   def: 44.4, unit: '%',  group: 'gradient' },
    { k: 'coreW',   label: '白光宽度',        min: .4,  max: 3,   step: .05,  def: 1.15, unit: '%',  group: 'gradient' },
    { k: 'fringeW', label: '色差边宽度',      min: .1,  max: 1.2, step: .05,  def: .35,  unit: '%',  group: 'gradient' },
    { k: 'feather', label: '羽化',            min: .1,  max: 1.5, step: .05,  def: .55,  unit: '%',  group: 'gradient' },
    { k: 'max',     label: '最大转动角',      min: 2,   max: 12,  step: .5,   def: 6,    unit: '°',  group: 'motion' },
    { k: 'ease',    label: '跟随时差',        min: .03, max: .3,  step: .005, def: .085, unit: '',   group: 'motion' },
    { k: 'sweep',   label: '扫光幅度',        min: 0,   max: 5,   step: .1,   def: 2.4,  unit: '×',  group: 'motion' }
  ];

  var p = {};
  DEFS.forEach(function (d) { p[d.k] = d.def; });
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    DEFS.forEach(function (d) {
      var v = parseFloat(saved[d.k]);
      if (isFinite(v)) { p[d.k] = Math.min(d.max, Math.max(d.min, v)); }
    });
  } catch (e) { /* 坏数据就当没有 */ }

  var face = document.getElementById('face');
  var faceMini = document.getElementById('face-mini');
  var plate = document.getElementById('plate');
  var plateMini = document.getElementById('plate-mini');
  var out = document.getElementById('out');
  var copyBtn = document.getElementById('copy');
  var resetBtn = document.getElementById('reset');

  function gradient(p) {
    var half = p.coreW / 2;
    var ws = p.center - half, we = p.center + half;
    var ts = ws - p.feather - p.fringeW, te = ws - p.feather;
    var rs = we + p.feather, re = rs + p.fringeW;
    var io = re + p.feather;
    function f(n) { return n.toFixed(2) + '%'; }
    return 'linear-gradient(' + p.angle + 'deg, ' +
      INK2 + ' 0%, ' + INK + ' 37%, ' + INK + ' ' + f(Math.max(0, ts - p.feather)) + ', ' +
      TEAL + ' ' + f(ts) + ', ' + TEAL + ' ' + f(te) + ', ' +
      WHITE + ' ' + f(ws) + ', ' + WHITE + ' ' + f(we) + ', ' +
      RED + ' ' + f(rs) + ', ' + RED + ' ' + f(re) + ', ' +
      INK + ' ' + f(io) + ', ' + INK + ' 100%)';
  }

  function exportCss(p) {
    return '/* css/site.css · .name-solid（由 tools/name-tuner.html 导出） */\n' +
      'background-image: ' + gradient(p) + ';\n' +
      'background-size: ' + p.size + '% 100%;';
  }

  function exportJs(p) {
    return '/* js/home.js · nameLift（由 tools/name-tuner.html 导出） */\n' +
      'var MAX = ' + p.max + ';      /* 最大转动角（度） */\n' +
      'var EASE = ' + p.ease + ';   /* 跟随系数：越小，时差越长 */\n' +
      '/* 扫光乘数：backgroundPosition 里 cy × ' + p.sweep + '，cx × ' + (Math.round(p.sweep * 75) / 100) + ' */';
  }

  function apply() {
    var g = gradient(p);
    face.style.backgroundImage = g;
    face.style.backgroundSize = p.size + '% 100%';
    faceMini.style.backgroundImage = g;
    faceMini.style.backgroundSize = p.size + '% 100%';
    out.textContent = exportCss(p) + '\n\n' + exportJs(p);
    try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) { /* 隐私模式 */ }
  }

  /* ---- 滑块 ---- */
  var outputs = {};
  DEFS.forEach(function (d) {
    var box = document.getElementById(d.group === 'gradient' ? 'sliders-gradient' : 'sliders-motion');
    var row = document.createElement('div');
    row.className = 'row';
    var label = document.createElement('label');
    label.textContent = d.label;
    label.setAttribute('for', 'ctl-' + d.k);
    var outEl = document.createElement('output');
    var input = document.createElement('input');
    input.type = 'range';
    input.id = 'ctl-' + d.k;
    input.min = d.min; input.max = d.max; input.step = d.step; input.value = p[d.k];
    var show = function () { outEl.textContent = String(p[d.k]) + d.unit; };
    input.addEventListener('input', function () {
      p[d.k] = parseFloat(input.value);
      show();
      apply();
    });
    show();
    outputs[d.k] = { input: input, show: show };
    row.appendChild(label); row.appendChild(outEl); row.appendChild(input);
    box.appendChild(row);
  });

  resetBtn.addEventListener('click', function () {
    DEFS.forEach(function (d) {
      p[d.k] = d.def;
      outputs[d.k].input.value = d.def;
      outputs[d.k].show();
    });
    apply();
  });

  copyBtn.addEventListener('click', function () {
    var text = out.textContent;
    var flash = function (label) {
      copyBtn.textContent = label;
      setTimeout(function () { copyBtn.textContent = '复制导出'; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash('已复制'); }, function () { flash('复制失败'); });
      return;
    }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      flash('已复制');
    } catch (e) { flash('复制失败'); }
  });

  apply();

  /* ---- 预览微动：与 js/home.js 同一套缓动，参数取自面板 ---- */
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm) { return; }

  var tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;

  function write() {
    var tf = 'rotateX(' + cx.toFixed(2) + 'deg) rotateY(' + cy.toFixed(2) + 'deg)';
    plate.style.transform = tf;
    plateMini.style.transform = tf;
    var posX = (50 - cy * p.sweep).toFixed(1) + '%';
    var posY = (50 - cx * p.sweep * 0.75).toFixed(1) + '%';
    face.style.backgroundPosition = posX + ' ' + posY;
    faceMini.style.backgroundPosition = posX + ' ' + posY;
  }

  function tick() {
    cx += (tx - cx) * p.ease;
    cy += (ty - cy) * p.ease;
    if (Math.abs(tx - cx) < 0.02 && Math.abs(ty - cy) < 0.02) {
      cx = tx; cy = ty; write(); raf = 0; return;
    }
    write();
    raf = requestAnimationFrame(tick);
  }

  window.addEventListener('pointermove', function (e) {
    var nx = (e.clientX / window.innerWidth - 0.5) * 2;
    var ny = (e.clientY / window.innerHeight - 0.5) * 2;
    tx = ny * p.max * 0.7;
    ty = -nx * p.max;
    if (!raf) { raf = requestAnimationFrame(tick); }
  }, { passive: true });

  document.documentElement.addEventListener('mouseleave', function () {
    tx = 0; ty = 0;
    if (!raf) { raf = requestAnimationFrame(tick); }
  });
}());
</script>
</body>
</html>
