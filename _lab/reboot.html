<!DOCTYPE html>
<html lang="zh-CN" data-theme="cool">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZLOONG · 从零</title>
<link rel="icon" href="../images/avatar.png">
<link rel="stylesheet" href="../css/tokens-screen.css">
<link rel="stylesheet" href="../css/site.css">
<style>
  /* 第二块砖：墨色亚克力外框 + 内嵌冷白纸 + 顶栏。主名未动。 */
  html, body { height: 100%; }
  /* 外圆角切掉的四个视口角、以及回弹区，都要与框同色 */
  html { background: #12171A; }

  body.reboot {
    --bezel: clamp(8px, 1.4vw, 20px);
    margin: 0;
    padding: var(--bezel);
    background: linear-gradient(118deg, #20262B 0%, #12171A 52%, #0B0F12 100%);
    min-height: 100svh;
  }
  /* site.css 那张全页方向光只服务旧版平面，lab 页的光在框上 */
  .reboot::before { display: none; }

  /* 外框是一块墨色亚克力：左上受光、右下背光，与主名同一束 118° 光。
     padding + mask 挖出中间，内圆角 = 外圆角 24 − 框宽。 */
  .bezel {
    position: fixed;
    inset: 0;
    z-index: 60;
    pointer-events: none;
    border-radius: 24px;
    border: var(--bezel) solid #12171A;
  }
  @supports (mask-composite: exclude) or (-webkit-mask-composite: xor) {
    .bezel {
      border: 0;
      padding: var(--bezel);
      background:
        linear-gradient(118deg, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 24%),
        linear-gradient(118deg, #20262B 0%, #12171A 52%, #0B0F12 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
    }
  }
  .bezel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.22);
  }
  @supports (mask-composite: exclude) or (-webkit-mask-composite: xor) {
    .bezel::after { inset: var(--bezel); }
  }

  .sheet {
    position: relative;
    min-height: calc(100svh - var(--bezel) * 2);
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 0 var(--pad) var(--s4);
    /* 内圆角 = 外圆角 24 − 框宽；滚动时这张纸从框下滑过去 */
    background: var(--bg);
    border-radius: 4px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.55),
      inset 0 2px 10px rgba(18,23,26,.07);
  }

  /* 顶栏：左边字标，右边两枚亚克力药丸 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: var(--s3) 0;
  }
  /* 左上不再是字标，而是一枚亚克力小牌里的头像；头像裁自 favicon，96px 供 2 倍屏 */
  .mark {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    background: linear-gradient(118deg, #FFFFFF 0%, #E7EDF0 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .95),
      inset 0 0 0 1px rgba(18, 23, 26, .08),
      0 1px 2px rgba(18, 23, 26, .06);
  }
  .mark img { display: block; width: 24px; height: 24px; }
  .mark:focus-visible { outline: 1px solid var(--mark); outline-offset: 3px; }
  .chips { display: flex; align-items: center; gap: 6px; }
  .chip {
    padding: 5px 13px 6px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: var(--t5);
    letter-spacing: .08em;
    text-decoration: none;
    color: var(--fg-dim);
    background: linear-gradient(118deg, #FFFFFF 0%, #E7EDF0 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .95),
      inset 0 0 0 1px rgba(18, 23, 26, .08),
      0 1px 2px rgba(18, 23, 26, .06);
    transition: color .18s, box-shadow .18s;
  }
  .chip:hover {
    color: var(--fg);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 1),
      inset 0 0 0 1px rgba(18, 23, 26, .14),
      0 1px 3px rgba(18, 23, 26, .10);
  }
  .chip:active { transform: translateY(1px); }
  .chip--on {
    color: #EDF2F4;
    background: linear-gradient(118deg, #20262B 0%, #0B0F12 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .16),
      0 1px 2px rgba(18, 23, 26, .20);
  }
  .chip--on:hover { color: #FFFFFF; }

  .stage { display: grid; place-items: center; min-height: 0; }

  .reboot .name {
    margin: 0;
    /* 词宽约为字号的 4.43 倍；320 宽下可用 264px，下限必须低于 59px 才不切字 */
    font-size: clamp(36px, 16.2vw, 230px);
    line-height: .9;
  }
  .reboot .name em { display: none; }

  .reboot__foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    font-family: var(--mono);
    font-size: var(--t5);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }
  .reboot__foot span:last-child { letter-spacing: .08em; text-transform: none; }
</style>
</head>
<body class="reboot">
  <div class="bezel" aria-hidden="true"></div>

  <div class="sheet">
    <header class="topbar">
      <a class="mark" href="reboot.html" aria-label="ZLOONG · 首页"><img src="../images/avatar.png" alt="" width="24" height="24"></a>
      <nav class="chips" aria-label="页面切换">
        <a class="chip chip--on" href="reboot.html" aria-current="page">首页</a>
        <a class="chip" href="../works.html">作品</a>
      </nav>
    </header>

    <main class="stage">
      <h1 class="name"><span class="name-plate"><span class="name-deep" aria-hidden="true">ZLOONG</span><span class="name-solid" data-name-solid>ZLOONG</span></span></h1>
    </main>

    <footer class="reboot__foot">
      <span>Dragonzhi</span>
      <span>闽ICP备20260330551号-1</span>
    </footer>
  </div>

  <script src="../js/home.js"></script>
</body>
</html>
