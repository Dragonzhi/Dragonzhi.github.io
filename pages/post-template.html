<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <title>博客文章 | Dragonzhi</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/blog.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/transition.css">
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <header>
            <div class="avatar-container">
                 <a href="../index.html" style="text-decoration: none; color: inherit;">
                    <div class="avatar">
                        <img src="../images/avatar.png" alt="Dragonzhi 的头像">
                    </div>
                    <h1>你好，我是 <span class="highlight">Dragonzhi</span></h1>
                    <p class="tagline">程序开发爱好者</p>
                </a>
            </div>
            <div id="theme-toggle" class="theme-toggle-button">
                <i class="fas fa-moon"></i>
            </div>
        </header>
        
        <main>
            <article class="post-content">
                <a href="blog.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回博客列表</a>
                <div id="post-container">
                    <!-- 文章内容将动态加载于此 -->
                </div>
            </article>
        </main>
        
        <footer>
            <p>© 2026 Dragonzhi · 用代码创造有趣的世界</p>
        </footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="../js/transition.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const postContainer = document.getElementById('post-container');
            try {
                const params = new URLSearchParams(window.location.search);
                const postSlug = params.get('slug');

                if (!postSlug) {
                    postContainer.innerHTML = '<p>错误：未指定文章。</p>';
                    return;
                }

                const postsResponse = await fetch('../data/posts.json');
                if (!postsResponse.ok) throw new Error('无法加载文章索引。');
                const posts = await postsResponse.json();
                
                const postData = posts.find(p => p.slug === postSlug);

                if (!postData) {
                    postContainer.innerHTML = '<p>错误：找不到指定的文章。</p>';
                    return;
                }

                document.title = `${postData.title} | Dragonzhi`;

                const markdownResponse = await fetch(`../${postData.file}`);
                if (!markdownResponse.ok) throw new Error('无法加载文章内容。');
                const markdown = await markdownResponse.text();
                
                postContainer.innerHTML = marked.parse(markdown);

            } catch (error) {
                console.error('加载文章时出错:', error);
                postContainer.innerHTML = '<p>抱歉，加载文章时出现错误。请稍后再试。</p>';
            }
        });
    </script>
</body>
</html>
