<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <title>博客 | Dragonzhi</title>
    <link rel="icon" href="images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/blog.css"> <!-- 博客专属样式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/transition.css">
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <header>
            <div class="avatar-container">
                <a href="../index.html" style="text-decoration: none; color: inherit;">
                    <div class="avatar">
                        <img src="../images/avatar.png" alt="Dragonzhi 的头像">
                    </div>
                    <h1>你好，我是 <span class="highlight">Dragonzhi</span></h1>
                    <p class="tagline">程序开发爱好者</p>
                </a>
            </div>
            <div id="theme-toggle" class="theme-toggle-button">
                <i class="fas fa-moon"></i>
            </div>
        </header>
        
        <main>
            <section id="blog-list" data-aos="fade-up">
                <h2><i class="fas fa-book-open"></i> 开发博客</h2>
                <div id="dynamic-post-list">
                    <!-- 文章列表将动态加载于此 -->
                </div>
                
                <script>
                    document.addEventListener('DOMContentLoaded', async () => {
                        const postListContainer = document.getElementById('dynamic-post-list');
                        try {
                            const response = await fetch('../data/posts.json');
                            if (!response.ok) throw new Error('Could not fetch posts.json');
                            const posts = await response.json();

                            if (posts.length === 0) {
                                postListContainer.innerHTML = '<p>暂无文章。</p>';
                                return;
                            }
                            
                            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                            posts.forEach(post => {
                                const postElement = document.createElement('div');
                                postElement.className = 'post-entry';

                                const postDate = new Date(post.date);
                                // 修正 UTC 日期问题，确保日期正确
                                const adjustedDate = new Date(postDate.valueOf() + postDate.getTimezoneOffset() * 60 * 1000);
                                const dateString = `${adjustedDate.getFullYear()}年${adjustedDate.getMonth() + 1}月${adjustedDate.getDate()}日`;
                                
                                postElement.innerHTML = `
                                    <h3>${post.title}</h3>
                                    <p class="post-meta">发布于 ${dateString}</p>
                                    <p>${post.summary}</p>
                                    <a href="post-template.html?slug=${post.slug}" class="button">阅读全文 <i class="fas fa-arrow-right"></i></a>
                                `;
                                postListContainer.appendChild(postElement);
                            });

                        } catch (error) {
                            console.error('Error loading blog posts:', error);
                            postListContainer.innerHTML = '<p>加载文章列表时出错。</p>';
                        }
                    });
                </script>
            </section>
        </main>
        
        <footer>
            <p>© 2026 Dragonzhi · 用代码创造有趣的世界</p>
            <p class="footer-note">最后更新: <span id="current-date"></span></p>
        </footer>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="../js/transition.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</body>
