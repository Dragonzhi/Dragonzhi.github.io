<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <title>洛天依画廊 | Dragonzhi</title>
    <link rel="icon" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
    <div id="particles-js"></div>
    <div id="theme-toggle" class="theme-toggle-button">
        <i class="fas fa-moon"></i>
    </div>
    
    <div class="gallery-container">
        <header class="gallery-header" data-aos="fade-down">
            <a href="../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> 返回主页
            </a>
            <h1><i class="fas fa-images"></i> 洛天依画廊</h1>
            <p>海洋之心系列 · 精选美图</p>
        </header>

        <div class="masonry-gallery" id="gallery">
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="关闭">
            <i class="fas fa-times"></i>
        </button>
        <button class="lightbox-prev" aria-label="上一张">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="lightbox-next" aria-label="下一张">
            <i class="fas fa-chevron-right"></i>
        </button>
        <div class="lightbox-content">
            <img src="" alt="" class="lightbox-image">
            <div class="lightbox-caption">
                <h3></h3>
                <p></p>
            </div>
        </div>
    </div>

    <button id="back-to-top" class="back-to-top" aria-label="回到顶部">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
