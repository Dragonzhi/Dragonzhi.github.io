                <a class="flat-action flat-action--primary" href="https://www.taptap.cn/app/981551" target="_blank" rel="noopener noreferrer">

                  <span class="flat-action__arrow" aria-hidden="true">↗</span>

                  <span class="flat-action__arrow" aria-hidden="true">↗</span>
