name: Update Project Data

on:
  schedule:
    - cron: '0 0 * * *' # 每天UTC时间0点自动运行一次
  workflow_dispatch: # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授予工作流写入仓库内容的权限
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch GitHub Repos
        env:
          GH_TOKEN: ${{ secrets.MY_GH_TOKEN }} # 安全地读取密钥
        run: |
          mkdir -p data
          curl -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/users/Dragonzhi/repos" > data/repos.json
          curl -H "Authorization: token $GH_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/ThePiSquad/CounterStrikeGrenades" > data/org-repo.json

      - name: Commit and Push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update project data" && git push)